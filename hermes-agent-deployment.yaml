---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app: hermes-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      nodeSelector:
        egress.network/internet: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: internet-egress
          effect: NoSchedule
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: seed-hermes-config
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              import json
              from pathlib import Path

              data = Path('/opt/data')
              if not (data / 'config.yaml').exists():
                  (data / 'config.yaml').write_bytes(Path('/seed/config.yaml').read_bytes())
              config = json.loads(Path('/seed/mem0.json').read_text())
              config['oss']['vector_store']['config']['password'] = __import__('os').environ['POSTGRES_PASSWORD']
              (data / 'mem0.json').write_text(json.dumps(config, indent=2) + '\n')
              for name in ('config.yaml', 'mem0.json'):
                  path = data / name
                  path.chmod(0o640)
                  __import__('os').chown(path, 10000, 10000)
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-password
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: k8s-pv02
              mountPath: /opt/data
              subPath: hermes-agent/opt-data
            - name: hermes-agent-config
              mountPath: /seed/config.yaml
              subPath: config.yaml
            - name: hermes-agent-config
              mountPath: /seed/mem0.json
              subPath: mem0.json
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:v2026.7.1
          imagePullPolicy: Always
          args:
            - gateway
            - run
          ports:
            - containerPort: 8642
              name: api
              protocol: TCP
            - containerPort: 9119
              name: dashboard
              protocol: TCP
          env:
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_GATEWAY_ADAPTER_DISCONNECT_TIMEOUT
              value: "30"
            - name: HASS_URL
              value: http://homeassistant:8123
            # cua-driver enables anonymous PostHog telemetry by default.
            # Keep it disabled even when the persistent Hermes config predates
            # the computer_use.cua_telemetry setting.
            - name: CUA_DRIVER_RS_TELEMETRY_ENABLED
              value: "0"
            - name: FIRECRAWL_API_URL
              value: http://firecrawl-api:3002
            - name: MEM0_HOST
              value: http://mem0:8000
          envFrom:
            - secretRef:
                name: hermes-agent-secret
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: k8s-pv02
              mountPath: /opt/data
              subPath: hermes-agent/opt-data
      volumes:
        - name: k8s-pv02
          persistentVolumeClaim:
            claimName: synology-k8s-pv02
        - name: hermes-agent-config
          configMap:
            name: hermes-agent-config
